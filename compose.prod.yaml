services:
  server:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?Set CLIENT_ORIGIN}
      COOKIE_SECURE: "true"
    ports:
      - "127.0.0.1:3000:3000"
  client:
    build:
      context: ./client
      args:
        API_URL: ${API_URL:?Set API_URL}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
