<div
  *ngIf="showModal"
  class="manage_modal__container"
  [class.close]="isClosing"
  #modalOverlayEl
>
  <div class="manage_modal__block" [class.close]="isClosing" #modalBlockEl role="dialog" aria-modal="true" [attr.aria-label]="typeIsTag ? 'Manage tag' : 'Manage note'">
    <h2>Manage {{ typeIsTag ? "Tag" : "Note" }}</h2>
    <form
      *ngIf="!typeIsTag"
      [formGroup]="this.noteForm"
      class="manage_modal__form"
    >
      <div class="manage_modal__form_inputs">
        <div class="manage_modal__form_input_container">
          <label for="note_title">Title</label>
          <input
            (input)="checkFormChange(noteForm)"
            formControlName="title"
            type="text"
            name="note_title"
            id="note_title"
          />
        </div>
        <div class="manage_modal__form_input_container">
          <label for="note_content">Content</label>
          <textarea
            (input)="checkFormChange(noteForm)"
            formControlName="content"
            name="note_content"
            id="note_content"
          ></textarea>
        </div>
        <div class="manage_modal__form_input_container">
          <label>Tags</label>
          <div class="manage_modal__tag_list">
            <button
              *ngFor="let tag of editingForm ? availableTags : selectedTags"
              type="button"
              (click)="toggleNoteTag(tag.id)"
              [disabled]="!editingForm"
              [ngStyle]="{ 'background-color': getTagColor(tag.color) }"
              [class.manage_modal__tag_selected]="noteTags.includes(tag.id)"
              [attr.aria-pressed]="noteTags.includes(tag.id)"
              class="manage_modal__tag"
            ><span class="manage_modal__tag_indicator" aria-hidden="true"></span>{{ tag.name }}</button>
          </div>
          <p *ngIf="!editingForm && selectedTags.length === 0" class="manage_modal__no_tags">No tags on this note.</p>
          <p *ngIf="editingForm && availableTags.length === 0" class="manage_modal__no_tags">No tags yet. Create one to organize your notes.</p>
        </div>
        <ng-container *ngIf="!editingForm">
          <div class="manage_modal__form_date_container">
            <label>Created at</label>
            <p>{{ noteData.createdAt | date: "dd/MM/YYYY" }}</p>
          </div>
          <div class="manage_modal__form_date_container">
            <label>Updated at</label>
            <p>{{ noteData.updatedAt | date: "dd/MM/YYYY" }}</p>
          </div>
        </ng-container>
      </div>
    </form>
    <form
      *ngIf="typeIsTag"
      [formGroup]="this.tagForm"
      class="manage_modal__form"
    >
      <div class="manage_modal__form_inputs">
        <div class="manage_modal__form_input_container">
          <label for="tag_name">Name</label>
          <input
            (input)="checkFormChange(tagForm)"
            formControlName="name"
            type="text"
            name="tag_name"
            id="tag_name"
          />
        </div>
        <div class="manage_modal__form_input_container manage_modal__color_control" #colorControlEl>
          <label for="tag_color">Color</label>
          <button
            type="button"
            id="tag_color"
            #colorButtonEl
            (click)="toggleColorPicker()"
            [disabled]="!editingForm"
            [attr.aria-expanded]="editingTagColor"
            aria-label="Choose tag color"
            [ngStyle]="{ 'background-color': getTagColor(tagColor?.value) }"
            class="manage_modal__current_tag_color"
          >
            <i *ngIf="editingForm" class="fa-solid fa-pen-to-square"></i>
          </button>
          <div *ngIf="editingTagColor" class="color_picker__list" aria-label="Tag colors"
            [style.top.px]="colorMenuPosition.top" [style.left.px]="colorMenuPosition.left">
            <button
              *ngFor="let item of tagColors"
              type="button"
              (click)="pickColor(item.id)"
              [ngStyle]="{ 'background-color': item.color }"
              [class.color_picker_modal__item_active]="item.id === tagColor?.value"
              [attr.aria-label]="item.name"
              [attr.aria-pressed]="item.id === tagColor?.value"
              class="color_picker__item"
            ></button>
          </div>
        </div>
        <ng-container *ngIf="!editingForm">
          <div class="manage_modal__form_date_container">
            <label>Created at</label>
            <p>{{ tagData.createdAt | date: "dd/MM/YYYY" }}</p>
          </div>
          <div class="manage_modal__form_date_container">
            <label>Updated at</label>
            <p>{{ tagData.updatedAt | date: "dd/MM/YYYY" }}</p>
          </div>
        </ng-container>
      </div>
    </form>
    <div *ngIf="!editingForm" class="manage_modal__buttons_container">
      <button (click)="delete()" class="manage_modal__delete_button">
        Delete
      </button>
      <button (click)="startHideModal()" class="manage_modal__cancel_button">
        Close
      </button>
      <button (click)="toggleEditForm()">Edit</button>
    </div>
    <div *ngIf="editingForm" class="manage_modal__buttons_container">
      <button (click)="toggleEditForm()" class="manage_modal__cancel_button">
        Cancel
      </button>
      <button
        (click)="save()"
        [disabled]="!formHasChanged"
        class="manaege_modal__save_button"
      >
        Save
      </button>
    </div>
  </div>
</div>
