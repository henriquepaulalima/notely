<div class="manage__list_header">
  <div class="manage__serach_input_container">
    <input
      (input)="sendSearchInputValue()"
      [formControl]="searchTextInput"
      type="text"
      name="search"
      id="search"
      placeholder="Search"
    />
    <label *ngIf="!searchTextInput.value" for="search">
      <i class="fa-solid fa-magnifying-glass"></i>
    </label>
    <label
      (click)="clearSearchInput()"
      *ngIf="searchTextInput.value"
      for="search"
    >
      <i class="fa-solid fa-xmark"></i>
    </label>
  </div>
  <button type="button" (click)="toggleOptionsModal()" aria-label="View options">
    <i class="fa-solid fa-ellipsis"></i>
  </button>
</div>

<div
  *ngIf="showOptionsModal"
  class="options_modal__container"
  [class.close]="isClosing"
  #modalOverlayEl
>
  <div class="options_modal__block" [class.close]="isClosing" #modalBlockEl role="dialog" aria-modal="true" aria-label="View options">
    <button type="button" class="options_modal__close" (click)="toggleOptionsModal()" aria-label="Close options"><i class="fa-solid fa-xmark"></i></button>
    <h2>Options</h2>
    <div class="options_modal__content_container">
      <h3>View mode</h3>
      <div class="options_modal__view_toggle">
        <input type="checkbox" id="manage_view_toggle" [checked]="viewMode === 1" (change)="changeViewMode($event)" aria-label="Use grid view" />
        <label for="manage_view_toggle">
          <span><i class="fa-solid fa-list"></i> List</span>
          <span><i class="fa-solid fa-border-all"></i> Grid</span>
        </label>
      </div>
    </div>
    <div class="options_modal__content_container">
      <h3>Order {{ manageTypeIsTag ? "tags" : "notes" }}</h3>
      <button
        *ngIf="!manageTypeIsTag"
        (click)="changeOrder(noteTitle)"
        [class.active]="activeOrderType === 0"
        class="options_modal__order_button"
      >
        <p>Title</p>
        <i
          [class.down]="noteTitle?.value === 1"
          class="fa-solid fa-arrow-up"
        ></i>
      </button>
      <button
        *ngIf="manageTypeIsTag"
        (click)="changeOrder(tagName)"
        [class.active]="activeOrderType === 1"
        class="options_modal__order_button"
      >
        <p>Name</p>
        <i [class.down]="tagName?.value === 1" class="fa-solid fa-arrow-up"></i>
      </button>
      <button
        (click)="changeOrder(createdAt)"
        [class.active]="activeOrderType === 2"
        class="options_modal__order_button"
      >
        <p>Created date</p>
        <i
          [class.down]="createdAt?.value === 1"
          class="fa-solid fa-arrow-up"
        ></i>
      </button>
    </div>
    <div *ngIf="!manageTypeIsTag" class="options_modal__content_container">
      <h3>Filter notes by tag</h3>
      <div class="options_modal__tag_filter_list">
        <button
          type="button"
          *ngFor="let item of tags"
          (click)="filterByTag(item)"
          class="options_modal__tag"
          [ngStyle]="{ 'background-color': getTagColor(item.color) }"
          [class.options_modal__tag_active]="filterTagInput.value?.id === item.id"
          [attr.aria-pressed]="filterTagInput.value?.id === item.id"
        >
          <span class="options_modal__tag_indicator" aria-hidden="true"></span>{{ item.name }}
        </button>
      </div>
      <div *ngIf="tags.length === 0" class="options_modal__no_tag_warning">
        <p>No tags found</p>
        <a routerLink="/create/tag" class="options_modal__no_tag_warning_link">
          Create a new tag
        </a>
      </div>
    </div>
  </div>
</div>
