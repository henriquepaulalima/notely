<div class="type__toggle">
  <input
    [formControl]="typeIsTag"
    (change)="handleInputChange()"
    type="checkbox"
    id="create_type_toggle"
  />
  <label for="create_type_toggle">
    <div>Note <span class="type__toggle_count">{{ noteCount }}</span></div>
    <div>Tag <span class="type__toggle_count">{{ tagCount }}</span></div>
  </label>
</div>
